[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "helion"
authors = [
  { name="Jason Ansel", email="jansel@meta.com" },
]
description = "A Python-embedded DSL that makes it easy to write ML kernels"
readme = "README.md"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typing_extensions>=4.0.0",
    "filecheck",
    "psutil",
    "rich",
    "numpy",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "expecttest",
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    "pre-commit",
    "hypothesis",
    "tabulate",
]
# Helion integrates tightly with the cutlass DSL's internal APIs; each
# upstream release tends to break the cute backend. The pin tracked in
# .github/ci_commit_pins/nvidia_cutlass_dsl.txt is the single source of
# truth — keep these extras in sync with that pin, and prefer
# scripts/install_cute.sh in CI/dev environments.
cute = [
    "nvidia-cutlass-dsl[cu13]==4.7.0",
    "apache-tvm-ffi",
]
pallas-tpu = [
    "jax[tpu]",
    "absl-py",
]
pallas-cpu = [
    "jax",
    "absl-py",
]
docs = [
    "docutils==0.18.1,<0.21",
    "linkify-it-py",
    "myst-parser",
    "pillow",
    "pytorch_sphinx_theme2==0.2.0",
    "sphinx==7.2.6",
    "sphinx-autobuild",
    "sphinx-autodoc-typehints",
    "sphinx-design==0.6.1",
    "sphinx-gallery==0.14.0",
    "sphinx-sitemap==2.7.1",
    "sphinxcontrib-mermaid==1.0.0",
    "sphinxcontrib.katex==0.9.10",
    "sphinxext-opengraph",
    "torch"
]

[project.urls]
Homepage = "https://github.com/pytorch/helion"
Issues = "https://github.com/pytorch/helion/issues"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["helion"]
extend-exclude = ["**/_helion_aot_*.py"]
force-exclude = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
line-ending = "lf"
exclude = [".github/*", "notebooks/**/*.ipynb"]

[tool.ruff.lint]
select = [
    "A", "ANN", "B", "C4", "COM", "D419", "E", "ERA001", "EXE", "F", "FA", "FLY", "FURB",
    "G", "I", "ISC", "LOG", "NPY", "PERF", "PGH", "PIE", "PLC0131", "PLC0132",
    "PLC0205", "PLC0208", "PLC2401", "PLC3002", "PLE", "PLR0133", "PLR0206",
    "PLR1722", "PLR1736", "PLW0129", "PLW0131", "PLW0133", "PLW0245", "PLW0406",
    "PLW0711", "PLW1501", "PLW1509", "PLW2101", "PLW3301", "PYI", "Q", "RET",
    "RSE", "RUF005", "RUF007", "RUF008", "RUF009", "RUF010", "RUF012", "RUF013",
    "RUF015", "RUF016", "RUF017", "RUF018", "RUF019", "RUF020", "RUF022", "RUF024",
    "RUF026", "RUF030", "RUF034", "RUF036", "RUF037", "RUF041", "RUF047", "RUF051",
    "RUF056", "RUF100", "RUF200", "S324", "SIM", "SLOT", "TCH", "TD001", "TD002",
    "TD004", "TID251", "TRY002", "TRY203", "TRY401", "UP", "W", "YTT",
]
ignore = [
    "C409", "C419", "COM812", "E501", "ERA001", "FURB189", "G004", "PERF203", "PERF401",
    "RET501", "SIM102", "SIM108", "SIM115", "UP035",
]
extend-safe-fixes = ["TC", "UP045", "RUF013", "RSE102"]
preview = true
exclude = ["test/data/*", ".github/*", "notebooks/**/*.ipynb", "_helion_aot_*.py"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# examples/ is a directory of standalone scripts, not a package; a bare
# ``import examples`` finds whichever ``examples`` directory is first on
# sys.path.  Load an example by path instead.
"examples".msg = "load example modules with helion._testing.import_example"

[tool.ruff.lint.per-file-ignores]
"test/*" = ["ANN"]
# This module's @cute.struct field annotations must NOT be stringified by
# `from __future__ import annotations` (it breaks CuTe MemRange/Align field-type
# resolution -> runtime TypeError). It is imported by generated kernels at
# runtime, not type-checked, so the forced future import (I002) is exempted.
"helion/_compiler/cute/_flash_runtime.py" = ["I002"]
"helion/_compiler/cute/_flash_row_mma_runtime.py" = ["I002"]
"helion/_compiler/cute/_warp_mma_runtime.py" = ["I002"]
"helion/_compiler/cute/_flash_alt_runtime.py" = ["I002"]
"helion/_compiler/cute/flex_score_mod_runtime.py" = ["I002"]
# Same: the vendored @cute.jit gemm_ptx_partial here must NOT have its annotations
# stringified by `from __future__ import annotations`. Imported by generated
# kernels at runtime, not type-checked, so I002 is exempted. The remaining codes
# (ANN/F841/FURB) are verbatim-vendored-FA4 style nits kept for diff fidelity.
"helion/_compiler/cute/_flash_gemm_ptx.py" = ["I002", "ANN001", "ANN202", "F841", "FURB113"]
# topk_impl.py's bitonic top-k (stage 2) is a faithful port of tallax's
# compressed-transpose kernel (tallax/tax/bitonic/*); its helpers are kept untyped
# for diff fidelity, so exempt the ANN nits (like the vendored file above).
"helion/_compiler/pallas/topk_impl.py" = ["ANN001", "ANN202", "ANN003"]
# Keep the attributed TileGym Triton kernel close to its upstream source. Normal
# Python annotations and style rewrites are inappropriate for several @triton.jit
# functions and would make future source comparisons needlessly difficult.
"benchmarks/cute/tilegym_attention.py" = [
  "I002",
  "ANN",
  "B008",
  "C408",
  "E731",
  "E741",
  "FURB136",
  "RET504",
  "RET505",
]

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
known-local-folder = ["helion"]
known-third-party = ["torch"]
required-imports = ["from __future__ import annotations"]
force-single-line = true  # better merge conflicts
force-sort-within-sections = true

[tool.hatch.build.targets.wheel]
packages = ["helion"]

[tool.hatch.build]
include = [
  "helion/**/*.py",
  "helion/**/*.pyi",
  "helion/**/*.json",
  "helion/_compiler/cute/selection/sorting_networks.LICENSE",
  "LICENSE",
]
exclude = [
  "test/**/*",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
markers = [
  # Also routes the item to the GPU lane when its module is ``cpu_only``.
  "cuda: requires an explicitly assigned CUDA device",
  # Selected by the CPU lane (`-m cpu_only`, no accelerator) and deselected by
  # the GPU jobs. Apply at module level only when every test in the module
  # passes with CUDA_VISIBLE_DEVICES="".
  "cpu_only: passes without an accelerator",
  # Fresh-interpreter replays, real autotune searches, and stress tests.
  # Pull requests run `-m 'not slow'`; pushes to main run everything.
  "slow: spawns interpreters or runs a real autotune search",
  # Runs the test under helion._testing.cpu_render_target(**kwargs): CPU code
  # generation against a fake B200 with CUDA and native compilation forbidden.
  "cpu_render: run under cpu_render_target (CPU CuTe source generation, fake B200)",
]
# The CuTe DSL deprecates names the generated code and the vendored tile
# schedulers still use; every tcgen05 compile emits them (about 249K records
# per cute suite run before this filter).  Each entry matches one message.
filterwarnings = [
  "ignore:tcgen05.OperandMajorMode is deprecated:DeprecationWarning",
  "ignore:cute.arch.exp2 is deprecated:DeprecationWarning",
  "ignore:FastDivmodDivisor is deprecated:DeprecationWarning",
  "ignore:Migrated to examples/CuTeDSL/helpers:DeprecationWarning",
]
# artifacts/ holds gitignored benchmark and probe outputs, some of them named
# test_*.py with import-time side effects; pytest must never collect them
# (pytest's built-in defaults plus artifacts and the docs build).
norecursedirs = [
  "*.egg",
  ".*",
  "_darcs",
  "build",
  "CVS",
  "dist",
  "node_modules",
  "venv",
  "{arch}",
  "artifacts",
  "site",
]

[tool.pyrefly]
project-includes = ["helion", "benchmarks", "docs", "examples"]
# _flash_gemm_ptx.py is verbatim-vendored FA4 code (gemm_ptx_partial +
# mma_sm100_desc) that indexes cute Tensor .shape/.stride dynamically -- pyrefly
# cannot model those cute-internal types and flags ~90 false bad-index errors.
# topk_impl.py's vendored bitonic port has dynamic-arity compare-swap returns +
# None-placeholder tile lists that pyrefly cannot model (false unpack/None-op
# errors); it is exercised by test/test_pallas.py + on-TPU benchmarks instead.
# The attributed TileGym Triton kernel similarly uses dynamic compiler-only
# values that are validated by GPU correctness tests rather than Pyrefly.
project-excludes = [
  "test",
  "_helion_aot_*.py",
  "helion/_compiler/cute/_flash_gemm_ptx.py",
  "helion/_compiler/pallas/topk_impl.py",
  "benchmarks/cute/tilegym_attention.py",
]
python-version = "3.10"
search-path = ["../pytorch"]
# MLX only installs on macOS; benchmarks/metal imports it as an optional
# baseline provider.
ignore-missing-imports = ["mlx", "mlx.*"]

[tool.codespell]
ignore-words = "scripts/dictionary.txt"
