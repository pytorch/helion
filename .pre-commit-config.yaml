repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-symlinks
    - id: destroyed-symlinks
    - id: trailing-whitespace
      exclude: '\.expected(?:$|_[^/]+$)'
    - id: end-of-file-fixer
      exclude: '\.expected$'
    - id: check-yaml
    - id: check-toml
    - id: check-ast
    - id: check-added-large-files
    - id: check-executables-have-shebangs
    - id: check-shebang-scripts-are-executable
    - id: requirements-txt-fixer
    - id: detect-private-key
    - id: debug-statements
      exclude: 'test/test_breakpoint\.py$'

-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.14
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # The linter with ruff's unsafe fixes as well; only `./lint.sh unsafe`
      # runs it (manual stage).
      - id: ruff
        alias: ruff-unsafe
        args: [--fix, --unsafe-fixes]
        stages: [manual]
      # Run the formatter.
      - id: ruff-format

-   repo: local
    hooks:
      - id: check-merge-conflict
        name: check unresolved conflict markers
        entry: python scripts/check_conflict_markers.py
        language: system
        types: [text]
      - id: check-main-in-examples
        name: ensure all example scripts have main()
        entry: python scripts/lint_examples_main.py
        language: system
        files: ^examples/.*\.py$
      - id: check-no-hardcoded-device
        name: disallow hard-coded device kwarg outside of DEVICE
        entry: python scripts/lint_no_hardcoded_device.py
        language: system
        files: ^(?:examples|test)/.*\.py$
      - id: check-backend-isolation
        name: core and sibling backends must not name the CuTe backend
        entry: python scripts/check_backend_isolation.py --strict
        language: system
        pass_filenames: false
        files: ^(helion/.*\.py|scripts/check_backend_isolation\.py)$

-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

-   repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.1.0
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        pass_filenames: false
        language: system
        entry: scripts/pyrefly_check.sh
