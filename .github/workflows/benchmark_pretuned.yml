name: Benchmark Pretuned

# Reusable workflow: runs every kernel under pretuned_kernels/ with its
# checked-in heuristic and reference baselines on a single GPU runner,
# then uploads aggregate JSON metrics as a pretuned-results-<alias> artifact.
# The Pretuned tab of
# the dashboard is built from these artifacts by
# .github/dashboard/build_pretuned_dashboard_data.py.

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      python-version:
        required: true
        type: string
      image:
        required: true
        type: string
      runtime-version:
        required: true
        type: string
      container-options:
        required: true
        type: string
      alias:
        required: true
        type: string
      kernels:
        required: false
        type: string
        default: ""
      env-vars:
        required: false
        type: string
        default: ""

jobs:
  benchmark:
    name: pretuned-${{ inputs.runtime-version }}-py${{ inputs.python-version }}-${{ inputs.alias }}

    container:
      image: ${{ inputs.image }}
      options: ${{ inputs.container-options }}

    runs-on: ${{ inputs.runner }}
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Run NVIDIA command
        if: startsWith(inputs.image, 'nvidia')
        run: |
          echo "Detected NVIDIA image"
          nvidia-smi || echo "nvidia-smi not found"

      - name: Run ROCm command
        if: startsWith(inputs.image, 'rocm')
        run: |
          echo "Detected ROCm image"
          rocminfo || echo "rocminfo not found"

      - name: Setup toolchain
        run: |
          set -x
          apt-get update
          apt-get install -y git

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: |
          uv venv --python ${{ inputs.python-version }}

      - name: Install PyTorch
        run: |
          source .venv/bin/activate

          # On OSDC, route through the pypi-cache /whl proxy (deps stay reachable behind the egress firewall) and clear the cache index vars so it wins over the cache default; off OSDC PYPI_CACHE_WHL_URL is unset so we hit download.pytorch.org.
          PYTORCH_INDEX="${PYPI_CACHE_WHL_URL:-https://download.pytorch.org/whl/cpu}"
          UV_DEFAULT_INDEX= UV_INDEX= uv pip install -U "torch==2.13.*" --index-url "${PYTORCH_INDEX%/whl/*}/whl/${{ inputs.runtime-version }}"

      - name: Install Helion
        run: |
          source .venv/bin/activate
          uv pip install setuptools ninja wheel
          SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" uv pip install -e .'[dev]'
          python -c "import helion; print(helion.__name__)"

      - name: Install vLLM (optional baseline)
        # vLLM supplies the production baselines the pretuned kernels compare
        # against (torch.ops._C.* quant ops, cutlass_scaled_mm). vLLM's nightly
        # wheel pins torch==2.13.0, matching the torch installed above. This is
        # non-fatal: if it fails, pretuned_kernels/run.py falls back to the
        # torch-native baselines.
        if: startsWith(inputs.image, 'nvidia')
        continue-on-error: true
        run: |
          source .venv/bin/activate
          # --index-strategy unsafe-best-match: vLLM nightly pins exact dep
          # versions (e.g. outlines-core==0.2.14) that live on PyPI, not on the
          # vLLM/pytorch nightly indexes; uv's default first-index-only strategy
          # then can't resolve them. unsafe-best-match lets uv pick the matching
          # version from any configured index.
          uv pip install -U vllm --pre \
            --index-strategy unsafe-best-match \
            --extra-index-url https://wheels.vllm.ai/nightly
          python -c "import vllm, torch; print('vllm', vllm.__version__, '| torch', torch.__version__)"

      - name: Install CuTe DSL
        # vLLM may upgrade nvidia-cutlass-dsl, but the vLLM baselines used here
        # call precompiled operators and do not use the Python DSL at runtime.
        # Reinstall Helion's tested pin so its CuTe kernels compile against the
        # expected API.
        if: inputs.alias == 'b200'
        run: |
          source .venv/bin/activate
          ./scripts/install_cute.sh cu13
          python - <<'PY'
          from helion._compiler.cute.cutedsl_compat import check_cute_backend_requirements

          check_cute_backend_requirements()
          print("Helion CuTe backend requirements OK")
          PY

      - name: Select grouped GEMM references
        id: grouped-gemm-references
        if: inputs.alias == 'b200'
        env:
          SELECTED_KERNELS: ${{ inputs.kernels }}
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import os

          from pretuned_kernels.run import grouped_reference_requirements

          outputs = grouped_reference_requirements(os.environ["SELECTED_KERNELS"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, enabled in outputs.items():
                  print(f"{name}={str(enabled).lower()}", file=output)
          PY

      - name: Fetch pinned CUTLASS grouped GEMM reference
        if: steps.grouped-gemm-references.outputs.cutlass == 'true'
        # If GitHub is temporarily unavailable, run.py records grouped_gemm as
        # an error while preserving results for every other B200 kernel.
        continue-on-error: true
        env:
          CUTLASS_GROUPED_GEMM_COMMIT: db1c288993354c88e551c40c19a8fb93a774a241
          CUTLASS_GROUPED_GEMM_SHA256: 05b74a05682c024557d83284e32f973ed5be4f0d1a1a12c72fe7824c29f7e94f
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import hashlib
          import os
          import urllib.request
          from pathlib import Path

          commit = os.environ["CUTLASS_GROUPED_GEMM_COMMIT"]
          expected = os.environ["CUTLASS_GROUPED_GEMM_SHA256"]
          url = (
              "https://raw.githubusercontent.com/NVIDIA/cutlass/"
              f"{commit}/examples/python/CuTeDSL/cute/blackwell/kernel/"
              "grouped_gemm/grouped_gemm.py"
          )
          with urllib.request.urlopen(url, timeout=60) as response:
              source = response.read()
          actual = hashlib.sha256(source).hexdigest()
          if actual != expected:
              raise RuntimeError(
                  f"CUTLASS grouped_gemm.py SHA256 mismatch: {actual} != {expected}"
              )
          output = Path(os.environ["RUNNER_TEMP"]) / "cutlass-grouped-gemm.py"
          output.write_bytes(source)
          with Path(os.environ["GITHUB_ENV"]).open("a") as env_file:
              print(
                  f"HELION_CUTLASS_GROUPED_GEMM_SOURCE={output}",
                  file=env_file,
              )
          print(f"Verified CUTLASS grouped GEMM reference: {output}")
          PY

      - name: Build pinned DeepGEMM grouped GEMM reference
        if: steps.grouped-gemm-references.outputs.deepgemm == 'true'
        # Keep the rest of the B200 dashboard useful if the external checkout
        # or build is temporarily unavailable; run.py will record only the
        # grouped_gemm_deepgemm row as failed.
        continue-on-error: true
        env:
          DEEPGEMM_COMMIT: 559d79fb6994a58b8a15b4b93bf13ccc16edf247
        run: |
          source .venv/bin/activate
          DEEPGEMM_CHECKOUT=$(mktemp -d "$RUNNER_TEMP/deepgemm.XXXXXX")
          git -C "$DEEPGEMM_CHECKOUT" init
          git -C "$DEEPGEMM_CHECKOUT" remote add origin \
            https://github.com/deepseek-ai/DeepGEMM.git
          git -C "$DEEPGEMM_CHECKOUT" fetch --depth=1 origin "$DEEPGEMM_COMMIT"
          git -C "$DEEPGEMM_CHECKOUT" checkout --detach FETCH_HEAD
          git -C "$DEEPGEMM_CHECKOUT" submodule update --init --recursive
          "$DEEPGEMM_CHECKOUT/develop.sh"
          echo "HELION_DEEPGEMM_ROOT=$DEEPGEMM_CHECKOUT" >> "$GITHUB_ENV"
          PYTHONPATH="$DEEPGEMM_CHECKOUT" python -c \
            "import deep_gemm; print('DeepGEMM reference build OK')"

      - name: CUDA Compute Check
        if: startsWith(inputs.image, 'nvidia')
        run: |
          source .venv/bin/activate
          python -c "
          import torch
          assert torch.cuda.is_available(), 'FATAL: CUDA not available'
          print(f'Device: {torch.cuda.get_device_name(0)}')
          "

      - name: Install tritonbench
        # The cudagraph-timed kernels (scaled_mm + fp8/quant ports) use
        # tritonbench's _do_bench_cudagraph_with_cache_clear, which clears the L2
        # cache each iteration (triton.testing.do_bench_cudagraph does not, so it
        # under-reports latency for graphs that replay the same inputs). Only the
        # do_bench component is needed, so install the package alone (--no-deps).
        # Required (no fallback): pretuned_kernels/_bench.py errors without it, so
        # this step must succeed for cudagraph kernels to benchmark.
        if: startsWith(inputs.image, 'nvidia')
        run: |
          source .venv/bin/activate
          mkdir -p benchmarks/ && pushd benchmarks/
          git clone https://github.com/pytorch-labs/tritonbench/
          pushd tritonbench/
          git checkout $(cat $GITHUB_WORKSPACE/.github/ci_commit_pins/tritonbench.txt)
          uv pip install -e . --no-deps
          popd && popd
          python -c "from tritonbench.components.do_bench.run import _do_bench_cudagraph_with_cache_clear; print('tritonbench cudagraph timer OK')"

      - name: Run pretuned kernel benchmarks
        env:
          SELECTED_KERNELS: ${{ inputs.kernels }}
        run: |
          source .venv/bin/activate

          TEST_REPORTS_DIR=$(pwd)/test/test-reports
          mkdir -p "$TEST_REPORTS_DIR"

          KERNEL_ARGS=()
          if [[ -n "$SELECTED_KERNELS" ]]; then
            KERNEL_ARGS=(--kernels "$SELECTED_KERNELS")
          fi

          ${{ inputs.env-vars }} python pretuned_kernels/run.py \
            --output "$TEST_REPORTS_DIR/pretuned-bench.json" \
            --hardware "${{ inputs.alias }}" \
            "${KERNEL_ARGS[@]}"

          echo "----- pretuned-bench.json -----"
          cat "$TEST_REPORTS_DIR/pretuned-bench.json"

      - name: Upload the pretuned benchmark results to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: pretuned-results-${{ inputs.alias }}
          path: test/test-reports
