# Run TPU benchmarks through the *tritonbench bridge* (benchmarks/run.py
# --device tpu), for kernels that have a tritonbench operator and run on TPU,
# mirroring the GPU nightly (benchmark.yml). Reuses the TPU-aware
# --list-impls-for-benchmark-ci for impl auto-discovery.
#
# run_tpu.py keeps: bmm (no tritonbench operator), cross_entropy (Helion Mosaic
# holdout), Helion-only kernels, and the full sweep.
name: Benchmark TPU (bridge)

on:
  workflow_call:
    inputs:
      alias:
        required: true
        type: string
      kernels:
        required: true
        type: string
        description: "Comma-separated tritonbench-backed kernels to run via the bridge on TPU."
      env-vars:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark-${{ inputs.alias }}-bridge

    env:
      HELION_BACKEND: pallas
      HELION_AUTOTUNE_LOG_LEVEL: INFO
      HELION_AUTOTUNE_EFFORT: full
      HELION_BENCHMARK_KERNEL_TIMEOUT: "3600"

    runs-on: linux.google.tpuv7x.1

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: uv venv --python 3.12

      - name: Install PyTorch (CPU nightly, pinned for TorchTPU)
        uses: ./.github/actions/install-pytorch-for-torchtpu

      - name: Install Helion
        run: |
          source .venv/bin/activate
          uv pip install setuptools ninja
          SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" uv pip install -e .'[dev]'
          python -c "import helion; print(helion.__name__)"

      - name: Build and install torch_tpu (Pallas)
        uses: ./.github/actions/build-torch-tpu

      # TPU-appropriate tritonbench install: base requirements + the dev-tpu
      # dependency group (transformers/triton/tabulate). Deliberately SKIP the
      # CUDA-only bits the GPU workflow does (quack-kernels, install.py --liger,
      # mamba-ssm, flash-linear-attention).
      # TODO: validate this recipe on the runner; requirements.txt may pull
      # CUDA-only packages that need excluding.
      - name: Install tritonbench (TPU)
        run: |
          set -x
          source .venv/bin/activate
          mkdir -p benchmarks/ && pushd benchmarks/
          git clone https://github.com/meta-pytorch/tritonbench/
          pushd tritonbench/
          git checkout $(cat $GITHUB_WORKSPACE/.github/ci_commit_pins/tritonbench.txt)
          git submodule update --init --recursive
          uv pip install -r requirements.txt
          # dev-tpu group deps needed by the bridged operators.
          uv pip install "transformers==5.0.0rc3" triton tabulate
          uv pip install -e . --no-deps
          popd
          popd

      # Backstop under the 6h job limit: a job cancelled at that limit skips
      # every remaining step, so the results collected so far are lost. Failing
      # the step instead keeps the upload below reachable. Kept well under 6h
      # because setup builds torch_tpu from source, which is only fast on a
      # remote-cache hit.
      - name: Run TPU Benchmark (bridge)
        timeout-minutes: 240
        run: |
          rm -rf /tmp/torchinductor_*/ || true
          source .venv/bin/activate
          TEST_REPORTS_DIR=$(pwd)/test/test-reports
          mkdir -p "$TEST_REPORTS_DIR"

          # Wall-clock the kernel loop may consume, leaving room under the
          # step's timeout-minutes to still report and upload. Per-kernel caps
          # are clamped to what remains so a few slow kernels cannot starve the
          # rest.
          SWEEP_BUDGET_S=$(( 200 * 60 ))
          sweep_start=$SECONDS
          incomplete_kernels=()

          KERNEL_LIST="${{ inputs.kernels }}"
          for kernel in ${KERNEL_LIST//,/ }; do
            echo "=== bridge TPU benchmark: $kernel ==="
            # Requires --list-impls-for-benchmark-ci to be TPU-aware (return only
            # TPU-runnable impls). See header note (2).
            KERNEL_INFO=$(python benchmarks/run.py --list-impls-for-benchmark-ci --device tpu --op $kernel | grep "^$kernel:")
            IMPLS=$(echo "$KERNEL_INFO" | sed -n 's/.*impls=\([^ ]*\).*/\1/p')
            BASELINE=$(echo "$KERNEL_INFO" | sed -n 's/.*baseline=\([^ ]*\).*/\1/p')
            if [[ -z "$IMPLS" || -z "$BASELINE" ]]; then
              echo "Warning: no runnable impls/baseline for $kernel on TPU, skipping..."
              continue
            fi

            # TPU differences vs GPU (benchmark.yml): --device tpu, per-kernel
            # --precision (see below), drop --cudagraph and
            # --latency-measure-mode triton_do_bench (CUDA/Triton-only; TPU uses
            # the wall-clock _do_bench_tpu path). Shapes are tritonbench's own,
            # count-capped by --num-inputs; per-kernel shape args (e.g. embedding
            # --B/--T/--D/--v-range) are supplied via inputs.env-vars / custom
            # args where a default shape exceeds TPU vmem.
            #
            # Precision follows the canonical helion examples per kernel: bf16
            # for gemm/softmax/layer_norm and rms_norm forward, fp32 for kl_div
            # and welford (examples/kl_div.py and examples/welford.py use fp32
            # inputs). kl_div keeps its loss reduction in fp32; welford's bf16
            # layer-norm output drifts ~1 ULP on near-zero values and trips the
            # 1e-2 accuracy tolerance for every correct impl.
            #
            # rms_norm-bwd fails differently: dweight reduces over all M rows,
            # and the eager baseline runs that accumulation in bf16, where
            # cancellation moves individual elements tens of percent away from
            # the true gradient. examples/rms_norm.py already accumulates
            # grad_weight in fp32, so at bf16 each impl is measured against a
            # baseline noisier than itself and no correct impl can pass. dx is
            # elementwise and stays in tolerance either way, and rms_norm
            # forward has no cross-row reduction, so it stays bf16.
            #
            # Forcing fp32 for these keeps each impl from being compared
            # against a downcast bf16 baseline.
            PRECISION=bf16
            case "$kernel" in
              kl_div|welford|rms_norm-bwd) PRECISION=fp32 ;;
            esac
            # Cap each kernel at HELION_BENCHMARK_KERNEL_TIMEOUT. The bridge
            # shells out to tritonbench's runner, which never reads that
            # variable (only run_tpu.py does), so enforce it here with
            # `timeout`. A kernel whose autotune runs long is abandoned and the
            # sweep moves on, instead of consuming the whole job's budget and
            # taking every other kernel's results down with it.
            # --kill-after escalates to SIGKILL: a run wedged inside an XLA
            # compile does not necessarily service SIGTERM.
            #
            # Resolve the duration in a subshell that has env-vars applied.
            # Bash expands a command's arguments before applying that command's
            # own scoped assignments, so writing `env-vars timeout "$VAR"`
            # directly would always use the job default and silently drop a
            # caller's override.
            kernel_timeout=$(${{ inputs.env-vars }} bash -c 'printf %s "$HELION_BENCHMARK_KERNEL_TIMEOUT"')
            remaining=$(( SWEEP_BUDGET_S - (SECONDS - sweep_start) ))
            if (( remaining <= 60 )); then
              echo "⏭️ $kernel skipped: sweep budget exhausted"
              incomplete_kernels+=("$kernel(skipped)")
              continue
            fi
            (( kernel_timeout > remaining )) && kernel_timeout=$remaining
            kernel_status=0
            ${{ inputs.env-vars }} HELION_PRINT_OUTPUT_CODE=1 HELION_MEASURE_COMPILE_TIME=1 \
              timeout --kill-after=60 "$kernel_timeout" \
              python benchmarks/run.py \
                --op $kernel \
                --device tpu \
                --precision $PRECISION \
                --helion-backend pallas \
                --metrics speedup,accuracy,latency \
                --measure-compile-time \
                --num-inputs 2 \
                --only $IMPLS \
                --only-match-mode prefix-with-baseline \
                --baseline $BASELINE \
                --atol 1e-2 \
                --rtol 1e-2 \
                --output "$TEST_REPORTS_DIR/helionbench.json" \
                --append-to-output \
                --keep-going || kernel_status=$?
            # 124 = timeout fired; 137 = SIGKILL, either timeout's escalation or
            # an OOM kill, so report the code rather than asserting a cause.
            if (( kernel_status == 124 || kernel_status == 137 )); then
              echo "⏱️ $kernel did not finish within ${kernel_timeout}s (exit $kernel_status)"
              incomplete_kernels+=("$kernel")
            elif (( kernel_status != 0 )); then
              echo "❌ $kernel exited $kernel_status"
              incomplete_kernels+=("$kernel")
            else
              echo "✅ $kernel"
            fi
            # Reap any survivor still holding the chip; otherwise every later
            # kernel fails to acquire it. Bracket the pattern so the match
            # cannot hit this shell.
            pkill -9 -f "[b]enchmarks/run.py" || true
          done

          if [[ ! -s "$TEST_REPORTS_DIR/helionbench.json" ]]; then
            echo "❌ helionbench.json is missing or empty"
            exit 1
          fi
          cat "$TEST_REPORTS_DIR/helionbench.json"

          # Fail once the results are on disk: the upload step runs regardless,
          # so the kernels that did finish still reach the dashboard, but a
          # dropped kernel stays visible instead of passing as a green run with
          # a silently missing column.
          if (( ${#incomplete_kernels[@]} > 0 )); then
            echo "❌ did not complete: ${incomplete_kernels[*]}"
            exit 1
          fi

      # Upload whatever the sweep produced, including when a kernel timed out or
      # failed above: results are appended per kernel, so a partial sweep still
      # carries every kernel that finished.
      - name: Upload the benchmark results to GitHub
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ inputs.alias }}
          path: test/test-reports
          if-no-files-found: warn
