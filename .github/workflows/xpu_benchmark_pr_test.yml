# TEMPORARY: validation-only workflow for the XPU benchmark enablement PR.
# It runs the same job Benchmark Dispatch's `run_xpu` toggle runs, but on
# pull_request so the plumbing (runner, image, torch xpu wheel, device args)
# can be exercised in CI. REVERT THIS FILE BEFORE MERGE.
name: XPU Benchmark PR Test (temporary)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-xpu:
    uses: ./.github/workflows/benchmark.yml
    permissions:
      id-token: write
      contents: read
    with:
      runner: linux.client.xpu
      python-version: "3.12"
      image: intel/omix:0.4.0-devel-ubuntu26.04
      runtime-version: xpu
      container-options: --device=/dev/dri --group-add video --ipc=host
      alias: b60
      kernels: gemm
