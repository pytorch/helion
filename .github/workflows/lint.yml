name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python-version }}

      # download.pytorch.org occasionally times out mid-install (uv gives up
      # after its own three retries), so retry each install with a backoff.
      - name: Install PyTorch
        run: |
          set -eux
          source .venv/bin/activate
          retry () {
            "$@" || (sleep 10 && "$@") || (sleep 20 && "$@") || (sleep 40 && "$@")
          }
          retry uv pip install -U --pre nvidia-nvshmem-cu13 --index-url https://download.pytorch.org/whl/nightly/cu130
          retry uv pip install -U --pre torch --index-url https://download.pytorch.org/whl/nightly/cu130

      - name: Install lint dependencies
        run: |
          set -eux
          source .venv/bin/activate
          retry () {
            "$@" || (sleep 10 && "$@") || (sleep 20 && "$@") || (sleep 40 && "$@")
          }
          retry uv pip install pyrefly==1.1.1
          retry uv pip install .'[dev,pallas-cpu]'
          retry ./scripts/install_cute.sh

      - name: Run pre-commit
        run: |
          source .venv/bin/activate
          set +e
          pre-commit run --all-files
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "❌ pre-commit changed files:"
            git --no-pager diff
            exit $STATUS
          fi
