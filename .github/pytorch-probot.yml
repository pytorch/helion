# The ciflow/main label on a pull request tags its head commit
# ciflow/main/<number>, which runs Tests as on main (test.yml).
ciflow_push_tags:
  - ciflow/main
retryable_workflows:
  - "test"
  - "benchmark"
retryable_step_names:
  - "Install PyTorch"
  - "Install Triton from source"
  - "CUDA Compute Check"
  - "Inductor Worker Check"
  - "XPU Compute Check"
